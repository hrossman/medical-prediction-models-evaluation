[project]
name = "medical-prediction-models-evaluation"
version = "0.1.0"
description = "Evaluation toolkit for medical prediction models based on Van Calster et al. (2025)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
