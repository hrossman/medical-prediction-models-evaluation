[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medpred-eval"
version = "0.2.0"
description = "Concise evaluation toolkit for binary medical prediction models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hagai Rossman" }]
keywords = [
    "clinical prediction",
    "calibration",
    "decision curve analysis",
    "medical AI",
    "model evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.12",
    "statsmodels>=0.14",
]

[project.urls]
Repository = "https://github.com/hagair/medical-prediction-models-evaluation"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["medpred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
